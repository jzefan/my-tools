[package]
name = "my-tools"
version = "1.0.0"
description = "my-tools - Productivity Toolkit"
authors = ["my-tools"]
edition = "2024"
autobins = false
default-run = "my-tools"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "my-tools"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "doc_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls", "gzip", "brotli", "system-proxy"] }
tokio = { version = "1", features = ["sync"] }
lopdf = "0.46.0"
walkdir = "2.5.0"
regex = "1.13.1"
image = "0.25.10"
flate2 = "1.1.10"
base64 = "0.23.1"
dirs = "7.0.0"
libc = "0.2"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
