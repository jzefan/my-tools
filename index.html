<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my-tools</title>
    <script>
      // 1. Polyfill Promise.withResolvers for WebKit / older engines
      if (typeof Promise.withResolvers !== 'function') {
        Promise.withResolvers = function() {
          var resolve, reject;
          var promise = new Promise(function(res, rej) {
            resolve = res;
            reject = rej;
          });
          return { promise: promise, resolve: resolve, reject: reject };
        };
      }

      // 2. Global diagnostics & unhandled error display
      window.addEventListener('error', function(e) {
        console.error('[DocTools Error]:', e.error || e.message);
        var errText = (e.error && (e.error.stack || e.error.message)) || e.message || 'Unknown Error';
        showErrorBanner(errText);
      });

      window.addEventListener('unhandledrejection', function(e) {
        console.error('[DocTools Unhandled Rejection]:', e.reason);
        var reasonText = (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason);
        showErrorBanner('Promise Rejection: ' + reasonText);
      });

      function showErrorBanner(msg) {
        var el = document.getElementById('fatal-error-banner');
        if (!el) {
          el = document.createElement('div');
          el.id = 'fatal-error-banner';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#ffffff;color:#b91c1c;padding:32px;z-index:99999999;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.6;overflow:auto;-webkit-user-select:text;user-select:text;';
          el.innerHTML = '<div style="max-width:800px;margin:0 auto;border:1px solid #fecaca;background:#fff5f5;border-radius:12px;padding:24px;box-shadow:0 10px 25px rgba(0,0,0,0.05);">'
            + '<div style="display:flex;align-items:center;margin-bottom:16px;">'
            + '<h2 style="font-size:16px;font-weight:700;color:#991b1b;margin:0;">前端脚本异常</h2>'
            + '</div>'
            + '<p style="color:#7f1d1d;margin-bottom:12px;font-size:12px;">以下错误导致界面无法正常挂载：</p>'
            + '<pre id="fatal-error-pre" style="background:#ffffff;border:1px solid #fee2e2;border-radius:8px;padding:16px;overflow:auto;font-size:12px;color:#dc2626;white-space:pre-wrap;word-break:break-all;"></pre>'
            + '<div style="margin-top:16px;display:flex;gap:8px;">'
            + '<button onclick="location.reload()" style="padding:6px 16px;background:#dc2626;color:#ffffff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;">刷新页面</button>'
            + '</div>'
            + '</div>';
          (document.body || document.documentElement).appendChild(el);
        }
        var pre = document.getElementById('fatal-error-pre');
        if (pre) {
          pre.textContent += (pre.textContent ? '\n\n' : '') + msg;
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
