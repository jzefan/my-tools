name: Windows build and tests

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --tests
      - name: Build Windows installer
        run: pnpm tauri build --bundles nsis
      - name: Frontend regression tests (including bundled PDF resources)
        run: node --test
      - uses: actions/upload-artifact@v4
        with:
          name: DocTools-Windows-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
