name: Build & Release Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS-Apple-Silicon
            os: macos-14
            target: aarch64-apple-darwin
            arch_id: macos-arm64
          - name: macOS-Intel
            os: macos-13
            target: x86_64-apple-darwin
            arch_id: macos-intel
          - name: Windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch_id: windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri app (macOS)
        if: runner.os == 'macOS'
        run: |
          pnpm tauri build --target ${{ matrix.platform.target }} --bundles dmg

      - name: Build Tauri app (Windows)
        if: runner.os == 'Windows'
        run: |
          pnpm tauri build --bundles nsis

      - name: Collect build artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p output_artifacts
          FOUND_DMG=$(find src-tauri/target -name "*.dmg" -type f | head -n 1)
          if [ -n "$FOUND_DMG" ] && [ -f "$FOUND_DMG" ]; then
            ORIGINAL_NAME=$(basename "$FOUND_DMG")
            cp "$FOUND_DMG" "output_artifacts/$ORIGINAL_NAME"
            cp "$FOUND_DMG" "output_artifacts/my-tools-${{ matrix.platform.arch_id }}.dmg"
            echo "Collected DMG: $ORIGINAL_NAME"
          else
            echo "::error::No DMG package found"
            exit 1
          fi

      - name: Collect build artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p output_artifacts
          FOUND_EXE=$(find src-tauri/target -name "*.exe" -type f | grep -i "setup\|bundle" | head -n 1)
          if [ -z "$FOUND_EXE" ]; then
            FOUND_EXE=$(find src-tauri/target -name "*.exe" -type f | grep -v "deps" | head -n 1)
          fi
          if [ -n "$FOUND_EXE" ] && [ -f "$FOUND_EXE" ]; then
            ORIGINAL_NAME=$(basename "$FOUND_EXE")
            cp "$FOUND_EXE" "output_artifacts/$ORIGINAL_NAME"
            cp "$FOUND_EXE" "output_artifacts/my-tools-${{ matrix.platform.arch_id }}-setup.exe"
            echo "Collected EXE: $ORIGINAL_NAME"
          else
            echo "::error::No Windows setup executable found"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform.arch_id }}
          path: output_artifacts/*
          if-no-files-found: error

  publish:
    name: Publish Release Packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release_assets
          echo "### 📦 发布文件列表与哈希校验" > ../RELEASE_BODY.md
          echo "" >> ../RELEASE_BODY.md
          echo "| 文件名 | 平台 / 架构 | 说明 |" >> ../RELEASE_BODY.md
          echo "| --- | --- | --- |" >> ../RELEASE_BODY.md
          echo "| \`my-tools-macos-arm64.dmg\` | macOS (Apple Silicon) | 适用 M1/M2/M3/M4 芯片 Mac |" >> ../RELEASE_BODY.md
          echo "| \`my-tools-macos-intel.dmg\` | macOS (Intel) | 适用 Intel 处理器 Mac |" >> ../RELEASE_BODY.md
          echo "| \`my-tools-windows-x64-setup.exe\` | Windows (x64) | 适用 64位 Windows 10/11 系统 |" >> ../RELEASE_BODY.md
          echo "" >> ../RELEASE_BODY.md
          echo "#### SHA256 校验和" >> ../RELEASE_BODY.md
          echo "\`\`\`text" >> ../RELEASE_BODY.md
          sha256sum * | tee SHA256SUMS.txt >> ../RELEASE_BODY.md || true
          echo "\`\`\`" >> ../RELEASE_BODY.md

      - name: Configure Git for Tag
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'my-tools 最新自动构建 (Latest)' }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release_assets/*
